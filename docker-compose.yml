# Local stack: MongoDB + API.  Run the frontend separately with `yarn start` in frontend/.
#   docker compose up --build
#   docker compose exec api python seed.py --reset    # optional demo data
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    build: ./backend
    depends_on:
      - mongo
    ports:
      - "8000:8000"
    environment:
      MONGO_URL: mongodb://mongo:27017
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-use-a-long-random-string}
      CORS_ORIGINS: http://localhost:3000
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads

volumes:
  mongo-data:
  uploads:
